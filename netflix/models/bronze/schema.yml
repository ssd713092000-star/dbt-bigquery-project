version: 2

models:
  - name: stg_movies
    description: "Cleaned movies catalog"
    columns:
      - name: movie_id
        description: "Primary key for movies"
        data_tests:
          - unique
          - not_null
      - name: title
        data_tests:
          - not_null
      - name: genres
        description: "Pipe-separated genres; silver splits this"
        data_tests:
          - not_null

  - name: stg_links
    description: "External IMDb and TMDb IDs for each movie"
    columns:
      - name: movie_id
        description: "One-to-one foreign key to stg_movies"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_movies')
                field: movie_id
      - name: imdb_id
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: tmdb_id
        description: "Nullable; silver flags missing values"
        data_tests:
          - unique:
              config:
                severity: warn

  - name: stg_ratings
    description: "User ratings for movies"
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: movie_id
        description: "Foreign key to stg_movies (many ratings per movie)"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_movies')
                field: movie_id
      - name: rating
        data_tests:
          - not_null
          - is_between:
              arguments:
                min_value: 0.5
                max_value: 5.0
              config:
                severity: warn
      - name: rated_at
        data_tests:
          - not_null
          - not_in_future

  - name: stg_tags
    description: "User-generated tags for movies"
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: movie_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_movies')
                field: movie_id
      - name: tag
        data_tests:
          - not_null
      - name: tagged_at
        data_tests:
          - not_null
          - not_in_future
